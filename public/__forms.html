<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <title>BengalDreams enquiry registration</title>
  </head>
  <body>
    <form hidden method='POST' name='bengaldreams-enquiry'>
      <input type="hidden" name="form-name" value="bengaldreams-enquiry" />
      <input name="subject" />
      <input name="venture" />
      <input name="venture-name" />
      <input name="name" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
